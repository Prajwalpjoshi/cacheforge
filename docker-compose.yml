services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cacheforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cacheforge}
      POSTGRES_DB: ${POSTGRES_DB:-cacheforge}
    ports:
      - "5432:5432"
    volumes:
      - cacheforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cacheforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cacheforge_pgdata:
